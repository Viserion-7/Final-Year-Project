<!DOCTYPE html>
<html>
<head>
    <title>Sanskrit Sandhi Splitter</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        input {
            width: 400px;
            padding: 10px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
        }
        .output {
            margin-top: 30px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1> Sanskrit Sandhi Splitter</h1>

    <form method="post" action="/split">
        <input type="text" name="text" placeholder="Enter Sanskrit text..." required>
        <button type="submit">Split</button>
    </form>

    <div class="output">
        <h3>mT5 Output:</h3>
        <p>{{ result_mt5 }}</p>
<!--
        <h3>ByT5 Output:</h3>
        <p>{{ result_byt5 }}</p>
    </div>
-->
    
</body>
</html>
